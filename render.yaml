services:
  - type: web
    name: fitbuddy-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile.backend
    autoDeploy: true
    healthCheckPath: /api/health
    startCommand: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fitbuddy-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fitbuddy-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: FRONTEND_BASE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: RABBITMQ_HOST
        value: fitbuddy-rabbitmq
      - key: RABBITMQ_PORT
        value: 5672
      - key: RABBITMQ_USER
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false

  - type: worker
    name: fitbuddy-celery-worker
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./celery_worker/Dockerfile
    autoDeploy: true
    startCommand: celery -A celery_worker.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fitbuddy-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fitbuddy-redis
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: RABBITMQ_HOST
        value: fitbuddy-rabbitmq
      - key: RABBITMQ_PORT
        value: 5672
      - key: RABBITMQ_USER
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false

  - type: worker
    name: fitbuddy-celery-beat
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./celery_worker/Dockerfile.beat
    autoDeploy: true
    startCommand: celery -A celery_worker.celery_app beat --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fitbuddy-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fitbuddy-redis
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: RABBITMQ_HOST
        value: fitbuddy-rabbitmq
      - key: RABBITMQ_PORT
        value: 5672
      - key: RABBITMQ_USER
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false

  - type: web
    name: fitbuddy-frontend
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: redis
    name: fitbuddy-redis
    plan: free
    ipAllowList: []

  - type: pserv
    name: fitbuddy-rabbitmq
    runtime: image
    plan: free
    image:
      url: rabbitmq:3.12-management-alpine
    autoDeploy: false
    envVars:
      - key: RABBITMQ_DEFAULT_USER
        sync: false
      - key: RABBITMQ_DEFAULT_PASS
        sync: false
      - key: RABBITMQ_DEFAULT_VHOST
        value: /

databases:
  - name: fitbuddy-postgres
    plan: free
    databaseName: fitbuddy
    user: fitbuddy
